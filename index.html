<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#7c6fff"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="BizBook KZ"/>
<meta name="description" content="Бухгалтерия для ИП и ТОО в Казахстане"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>BizBook KZ</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0f0f14;--card:#1a1a22;--card2:#22222e;
    --border:rgba(255,255,255,0.07);
    --purple:#7c6fff;--green:#3ecf8e;--orange:#ff9f43;--red:#ff6060;--blue:#54a0ff;
    --text:#f0f0f5;--muted:#888;--dim:#444;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bot:env(safe-area-inset-bottom,0px);
  }
  html,body{height:100%;background:#070710;display:flex;justify-content:center;align-items:center;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
  #shell{
    width:min(390px,100vw);
    height:min(844px,100vh);
    background:var(--bg);
    border-radius:clamp(0px,44px,(100vh - 844px)/2 * 99);
    overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 40px 120px rgba(0,0,0,0.9),0 0 0 1px rgba(255,255,255,0.06);
    position:relative;
  }
  #statusbar{padding:calc(var(--safe-top) + 10px) 24px 6px;display:flex;justify-content:space-between;flex-shrink:0;background:var(--bg)}
  #statusbar span{color:var(--text);font-size:12px;font-weight:600}
  #screen{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:none;-webkit-overflow-scrolling:touch}
  #screen::-webkit-scrollbar{display:none}
  #navbar{display:flex;justify-content:space-around;align-items:center;padding:8px 0 calc(var(--safe-bot) + 10px);border-top:1px solid var(--border);background:var(--bg);flex-shrink:0}
  .nav-btn{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 12px;min-width:56px}
  .nav-btn .nicon{font-size:20px}
  .nav-btn .nlabel{font-size:9px;font-weight:600;color:var(--dim);transition:color .2s}
  .nav-btn.active .nlabel{color:var(--purple)}
  .nav-dot{width:4px;height:4px;border-radius:2px;background:var(--purple);margin-top:1px}

  /* Screens */
  .scr{min-height:100%;padding-bottom:20px}
  .scr-pad{padding:18px 20px 0}
  .page-title{color:var(--text);font-size:20px;font-weight:800;margin:0 0 14px}
  .section-label{color:var(--muted);font-size:10px;font-weight:700;margin:18px 0 10px;text-transform:uppercase;letter-spacing:1px}

  /* Cards */
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
  .card2{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
  .gradient-card{background:linear-gradient(135deg,var(--purple),var(--green));border-radius:20px;padding:20px 22px;position:relative;overflow:hidden}
  .gradient-card::after{content:'';position:absolute;right:-20px;top:-20px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,0.07)}

  /* Buttons */
  .btn-primary{width:100%;padding:15px;border-radius:14px;background:linear-gradient(135deg,var(--purple),var(--green));border:none;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s}
  .btn-primary:active{opacity:.85}
  .btn-primary:disabled{background:var(--dim);cursor:not-allowed}
  .btn-sec{width:100%;padding:13px;border-radius:12px;background:var(--card2);border:1px solid var(--border);color:var(--muted);font-size:14px;font-weight:600;cursor:pointer}
  .btn-danger{width:100%;padding:13px;border-radius:12px;background:rgba(255,96,96,0.1);border:1px solid rgba(255,96,96,0.2);color:var(--red);font-size:14px;font-weight:600;cursor:pointer}
  .btn-sm{padding:8px 16px;border-radius:18px;border:none;font-size:13px;font-weight:600;cursor:pointer}
  .btn-purple-sm{background:var(--purple);color:#fff}
  .btn-outline-sm{background:var(--card2);border:1px solid var(--border);color:var(--muted)}

  /* Form */
  .field{margin-bottom:13px}
  .field label{display:block;color:var(--muted);font-size:10px;font-weight:700;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
  .field input,.field select{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);font-size:14px;outline:none;font-family:inherit}
  .field input::placeholder{color:var(--dim)}

  /* Badges */
  .badge{display:inline-block;font-size:10px;padding:3px 8px;border-radius:20px;font-weight:600}
  .badge-green{background:rgba(62,207,142,0.15);color:var(--green)}
  .badge-orange{background:rgba(255,159,67,0.15);color:var(--orange)}
  .badge-red{background:rgba(255,96,96,0.15);color:var(--red)}
  .badge-purple{background:rgba(124,111,255,0.15);color:var(--purple)}
  .badge-blue{background:rgba(84,160,255,0.15);color:var(--blue)}
  .badge-dim{background:rgba(68,68,68,0.3);color:var(--muted)}

  /* Doc row */
  .doc-row{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:12px 13px;margin-bottom:9px;cursor:pointer;transition:background .15s}
  .doc-row:active{background:var(--card2)}
  .doc-icon{border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

  /* Toggle switch */
  .toggle-wrap{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:14px;cursor:pointer}
  .toggle{width:42px;height:24px;border-radius:12px;background:var(--dim);display:flex;align-items:center;padding:0 3px;transition:background .2s;flex-shrink:0}
  .toggle.on{background:var(--red)}
  .toggle-thumb{width:18px;height:18px;border-radius:9px;background:#fff;transition:transform .2s}
  .toggle.on .toggle-thumb{transform:translateX(18px)}

  /* Bottom sheet */
  .sheet-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:flex-end;z-index:200;border-radius:inherit}
  .sheet{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-height:78%;display:flex;flex-direction:column}
  .sheet-handle{width:36px;height:4px;background:#444;border-radius:2px;margin:14px auto 0}
  .sheet-body{padding:14px 20px 28px;overflow-y:auto;flex:1}

  /* Progress bar */
  .progress-bar{display:flex;gap:5px;padding:10px 20px 0}
  .progress-step{flex:1;height:3px;border-radius:2px;background:var(--card2);transition:background .3s}
  .progress-step.done{background:var(--purple)}

  /* Ripple tap */
  .tappable{position:relative;overflow:hidden}

  /* Splash gradient bg */
  .splash-bg{background:radial-gradient(ellipse at top,#1a1230 0%,var(--bg) 65%)}

  /* Keyboard numpad */
  .numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
  .numpad button{height:52px;border-radius:14px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:20px;font-weight:600;cursor:pointer}
  .numpad button:active{background:var(--card2)}
  .numpad button.empty{background:transparent;border:none;cursor:default}

  /* Pin dots */
  .pin-dots{display:flex;gap:14px;justify-content:center;margin-bottom:28px}
  .pin-dot{width:48px;height:58px;background:var(--card2);border:2px solid var(--border);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--text);transition:border-color .15s}
  .pin-dot.filled{border-color:var(--purple)}

  /* Filter chips */
  .chip-row{display:flex;gap:7px;overflow-x:auto;padding:10px 20px 0;scrollbar-width:none}
  .chip-row::-webkit-scrollbar{display:none}
  .chip{padding:6px 14px;border-radius:18px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s}
  .chip.active{background:rgba(124,111,255,0.2);border-color:var(--purple);color:var(--purple)}

  /* Notification bar */
  .notif{border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;margin-bottom:10px}
  .notif-orange{background:rgba(255,159,67,0.1);border:1px solid rgba(255,159,67,0.25)}
  .notif-green{background:rgba(62,207,142,0.1);border:1px solid rgba(62,207,142,0.25)}

  /* Animations */
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
  .fade-in{animation:fadeIn .25s ease}
  .slide-up{animation:slideUp .3s ease}

  /* Success screen */
  .success-emoji{font-size:72px;animation:bounceIn .5s ease;display:block;text-align:center;margin-bottom:18px}
  @keyframes bounceIn{0%{transform:scale(0.3)}60%{transform:scale(1.1)}80%{transform:scale(0.95)}100%{transform:scale(1)}}

  @media(max-width:390px){
    #shell{border-radius:0;height:100vh;width:100vw}
  }
</style>
</head>
<body>

<script>

  ],

  ],

    {id:2,date:'05.05.2026',desc:'Налог 910 форма',amount:-18500,type:'out'},

    {id:4,date:'01.05.2026',desc:'Комиссия банка',amount:-1200,type:'out'},
  ],
  cash: [
    {id:1,date:'06.05.2026',desc:'Наличная оплата от клиента',amount:50000,type:'in'},
    {id:2,date:'04.05.2026',desc:'Хозяйственные расходы',amount:-8000,type:'out'},
  ],
  cpSearch: '',
  newCp: {name:'',bin:'',contact:'',phone:'',email:'',address:''},
  reportStep: 1,
  IP: {name:'Сарсенов Алибек Берикович',iin:'850312300145',ipName:'ИП Сарсенов А.Б.',bank:'Halyk Bank',bik:'HSBKKZKX',iik:'KZ12 3456 7890 1234 5678',phone:'+7 701 234 56 78',email:'sarssenov@gmail.com',address:'г. Алматы, ул. Абая 150, оф. 12',regime:'Упрощённая декларация (910)'}
};

// ─── Router ───────────────────────────────────────────────────────
const NAV_SCREENS = ['home','docs','bank','reports','profile','counterparties'];
const AUTH_SCREENS = ['splash','register','sms','login','setupCompany','setupTax','setupBank'];

function go(screen) {
  S.screen = screen;
  render();
  document.getElementById('screen').scrollTop = 0;
}

function nav(tab) {
  go(tab);
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
    const dot = b.querySelector('.nav-dot');
    if(dot) dot.remove();
    if(b.dataset.tab === tab) {
      const d = document.createElement('div');
      d.className = 'nav-dot';
      b.appendChild(d);
    }
  });
}

function render() {
  const scr = document.getElementById('screen');
  const navbar = document.getElementById('navbar');
  const statusbar = document.getElementById('statusbar');
  const isAuth = AUTH_SCREENS.includes(S.screen);
  statusbar.style.display = isAuth ? 'none' : 'flex';
  navbar.style.display = NAV_SCREENS.includes(S.screen) ? 'flex' : 'none';
  scr.innerHTML = getScreen(S.screen);
  scr.className = 'fade-in';
  // update nav active
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === S.screen);
  });
}

// ─── Clock ────────────────────────────────────────────────────────
function updateClock() {
  const el = document.getElementById('clock');
  if(el) { const n=new Date(); el.textContent=`${n.getHours()}:${String(n.getMinutes()).padStart(2,'0')}`; }
}
setInterval(updateClock, 10000);

// ─── Helpers ──────────────────────────────────────────────────────
const PAY = {
  paid:    {label:'Оплачен',         cls:'badge-green'},
  partial: {label:'Частично',        cls:'badge-orange'},
  unpaid:  {label:'Не оплачен',      cls:'badge-red'},
};
const SHIP = {
  shipped:   {label:'Отгружен',      cls:'badge-green'},
  unshipped: {label:'Не отгружен',   cls:'badge-dim'},
};
const DOC_ICON = {'счёт':'📄','акт':'✅','ЭСФ':'🧾','ЭАВР':'📋','СФ':'🗂','накладная':'📦'};
const DOC_COLOR = {'счёт':'#7c6fff','акт':'#3ecf8e','ЭСФ':'#ff9f43','ЭАВР':'#54a0ff','СФ':'#ff9f43','накладная':'#888'};

const payBadge = s => `<span class="badge ${PAY[s]?.cls||'badge-red'}">${PAY[s]?.label||'—'}</span>`;
const shipBadge = s => `<span class="badge ${SHIP[s]?.cls||'badge-dim'}">${SHIP[s]?.label||'—'}</span>`;
const docIconEl = (type, size=38) => {
  const c = DOC_COLOR[type]||'#7c6fff'; const ic = DOC_ICON[type]||'📄';
  return `<div class="doc-icon" style="width:${size}px;height:${size}px;background:${c}22;font-size:${size*.42}px">${ic}</div>`;
};
const infoField = (label, value) => `
  <div class="field">
    <label>${label}</label>
    <div style="background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:11px 13px;color:${value?'var(--text)':'var(--dim)'};font-size:13px">${value||'—'}</div>
  </div>`;
const backBtn = (target) => `<button onclick="go('${target}')" style="background:none;border:none;cursor:pointer;color:var(--purple);font-size:26px;padding:0;line-height:1;margin-right:6px">‹</button>`;

// ─── SCREENS ──────────────────────────────────────────────────────
function getScreen(s) {
  switch(s) {
    case 'splash': return splashScreen();
    case 'register': return registerScreen();
    case 'sms': return smsScreen();
    case 'login': return loginScreen();
    case 'setupCompany': return setupCompanyScreen();
    case 'setupTax': return setupTaxScreen();
    case 'setupBank': return setupBankScreen();
    case 'home': return homeScreen();
    case 'docs': return docsScreen();
    case 'docDetail': return docDetailScreen();
    case 'bank': return bankScreen();
    case 'reports': return reportsScreen();
    case 'report910': return report910Screen();
    case 'profile': return profileScreen();
    case 'counterparties': return counterpartiesScreen();
    case 'cpDetail': return cpDetailScreen();
    case 'newCP': return newCPScreen();
    case 'newDoc': return newDocScreen();
    case 'success': return successScreen();
    default: return splashScreen();
  }
}

// ─── SPLASH ───────────────────────────────────────────────────────
function splashScreen() { return `
<div class="scr splash-bg" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 28px;min-height:100%">
  <div style="width:88px;height:88px;border-radius:26px;background:linear-gradient(135deg,var(--purple),var(--green));display:flex;align-items:center;justify-content:center;font-size:44px;margin-bottom:24px;box-shadow:0 20px 50px rgba(124,111,255,0.4)">💼</div>

// ─── REGISTER ─────────────────────────────────────────────────────
function registerScreen() { return `

</div>`; }

// ─── SMS ──────────────────────────────────────────────────────────
function smsScreen() {
  const code = S.pinCode;
  return `
<div class="scr" style="display:flex;flex-direction:column;padding:24px 20px">
  <button onclick="go('register')" style="background:none;border:none;color:var(--purple);font-size:26px;cursor:pointer;padding:0;width:fit-content">‹</button>
  <h2 style="color:var(--text);font-size:22px;font-weight:800;margin:14px 0 4px">SMS-подтверждение</h2>
  <p style="color:var(--muted);font-size:13px;margin:0 0 28px">Введите код из SMS на +7 700 *** ** **</p>
  <div class="pin-dots">
    ${[0,1,2,3].map(i=>`<div class="pin-dot ${code.length>i?'filled':''}">${code[i]||''}</div>`).join('')}

    <h2 style="color:var(--text);font-size:15px;font-weight:700;margin:0">⚡ Форма 910 — Упрощённая декларация</h2>

// ─── COUNTERPARTIES ───────────────────────────────────────────────
function counterpartiesScreen() {
  const q = S.cpSearch.toLowerCase();
  const filtered = S.counterparties.filter(c=>c.name.toLowerCase().includes(q)||c.bin.includes(q));
  return `
<div class="scr">
  <div class="scr-pad" style="display:flex;justify-content:space-between;align-items:center">
    <h2 class="page-title" style="margin:0">Контрагенты</h2>
    <button class="btn-sm btn-purple-sm" onclick="S.newCp={name:'',bin:'',contact:'',phone:'',email:'',address:''};go('newCP')">+ Добавить</button>
  </div>
  <div style="padding:10px 20px 0">
    <input type="text" placeholder="🔍 Поиск по названию или БИН..." value="${S.cpSearch}"
      oninput="S.cpSearch=this.value;render()"
      style="width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 14px;color:var(--text);font-size:13px;outline:none;box-sizing:border-box"/>
  </div>
  <div class="scr-pad">
    ${filtered.length===0?'<p style="color:var(--muted);text-align:center;padding:30px 0">Не найдено</p>':
    filtered.map(c=>`
      <div class="doc-row" onclick="S.selectedCpId=${c.id};go('cpDetail')">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="width:44px;height:44px;border-radius:22px;flex-shrink:0;background:linear-gradient(135deg,rgba(124,111,255,0.3),rgba(62,207,142,0.3));display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;color:var(--text)">${c.name[0]}</div>
          <div style="flex:1;min-width:0">
            <p style="color:var(--text);font-size:13px;font-weight:600;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.name}</p>
            <p style="color:var(--dim);font-size:11px;margin:3px 0 0">БИН: ${c.bin}${c.contact?` · ${c.contact}`:''}</p>
          </div>
          <span style="color:var(--purple);font-size:20px">›</span>
        </div>
      </div>`).join('')}
  </div>
</div>`; }

function cpDetailScreen() {
  const cp = S.counterparties.find(c=>c.id===S.selectedCpId);
  if(!cp) return counterpartiesScreen();
  const cpDocs = S.docs.filter(d=>d.client===cp.name);
  return `
<div class="scr">
  <div class="scr-pad" style="display:flex;align-items:center;gap:10px">
    ${backBtn('counterparties')}
    <h2 style="color:var(--text);font-size:17px;font-weight:700;margin:0">Контрагент</h2>
  </div>
  <div class="scr-pad">
    <div style="background:linear-gradient(135deg,rgba(124,111,255,0.15),rgba(62,207,142,0.15));border:1px solid rgba(124,111,255,0.15);border-radius:18px;padding:18px;text-align:center;margin-bottom:16px">
      <div style="width:52px;height:52px;border-radius:26px;margin:0 auto 10px;background:linear-gradient(135deg,var(--purple),var(--green));display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff">${cp.name[0]}</div>
      <h3 style="color:var(--text);font-size:15px;font-weight:700;margin:0 0 2px">${cp.name}</h3>
      <p style="color:var(--muted);font-size:11px;margin:0">БИН: ${cp.bin}</p>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <div style="flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center"><p style="color:var(--text);font-size:16px;font-weight:800;margin:0 0 2px">${cpDocs.length}</p><p style="color:var(--muted);font-size:10px;margin:0">Документов</p></div>
      <div style="flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center"><p style="color:var(--text);font-size:14px;font-weight:800;margin:0 0 2px">${fmt(cpDocs.reduce((s,d)=>s+d.amount,0))}</p><p style="color:var(--muted);font-size:10px;margin:0">Сумма</p></div>
    </div>
    ${cp.contact?infoField('Контактное лицо',cp.contact):''}
    ${cp.phone?infoField('Телефон',cp.phone):''}
    ${cp.email?infoField('Email',cp.email):''}
    ${cp.address?infoField('Адрес',cp.address):''}
    ${cpDocs.length>0?`<p class="section-label">Документы</p>${cpDocs.map(doc=>`
      <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px">
        ${docIconEl(doc.type,32)}
        <div style="flex:1"><p style="color:var(--text);font-size:12px;font-weight:600;margin:0">${doc.service}</p><p style="color:var(--dim);font-size:10px;margin:2px 0 0">${doc.date}</p></div>
        <div style="text-align:right"><p style="color:var(--text);font-size:12px;font-weight:700;margin:0 0 3px">${fmt(doc.amount)}</p>${payBadge(doc.payStatus)}</div>
      </div>`).join('')}`:''}
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn-sec" style="flex:1">✏️ Редактировать</button>
      <button class="btn-danger" style="flex:1">🗑 Удалить</button>
    </div>
  </div>
</div>`; }

function newCPScreen() { return `
<div class="scr">
  <div class="scr-pad" style="display:flex;align-items:center;gap:10px">
    ${backBtn('counterparties')}
    <h2 style="color:var(--text);font-size:17px;font-weight:700;margin:0">Новый контрагент</h2>
  </div>
  <div class="scr-pad">
    <div class="field"><label>Название / ФИО *</label><input type="text" placeholder='ТОО "Компания"' oninput="S.newCp.name=this.value"/></div>
    <div class="field"><label>БИН / ИИН *</label><input type="text" placeholder="123456789012" oninput="S.newCp.bin=this.value"/></div>
    <div class="field"><label>Контактное лицо</label><input type="text" placeholder="Иванов Иван" oninput="S.newCp.contact=this.value"/></div>
    <div class="field"><label>Телефон</label><input type="tel" placeholder="+7 700 000 00 00" oninput="S.newCp.phone=this.value"/></div>
    <div class="field"><label>Email</label><input type="email" placeholder="info@company.kz" oninput="S.newCp.email=this.value"/></div>
    <div class="field"><label>Адрес</label><input type="text" placeholder="г. Алматы, ул. ..." oninput="S.newCp.address=this.value"/></div>
    <button class="btn-primary" onclick="
      if(S.newCp.name&&S.newCp.bin){

  </div>
</div>`; }

    <div>
      <h3 style="color:#fff;font-size:15px;font-weight:700;margin:0 0 2px">${S.IP.name}</h3>
